
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My Image Gallery</h1>
        <p>Beautiful moments, captured forever.</p>
    </header>

    <main>
        <div class="filters">
            <button class="active" data-filter="all">All</button>
            <button data-filter="nature">Nature</button>
            <button data-filter="animals">Animals</button>
            <button data-filter="flowers">Flowers</button>
        </div>

        <section class="gallery">
            <div class="gallery-item" data-category="nature">
                <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=800" alt="Beautiful mountain lake">
                <h3>Mountain View</h3>
            </div>

            <div class="gallery-item" data-category="animals">
                <img src="https://images.unsplash.com/photo-1517849845537-4d257902454a?w=800" alt="Cute dog">
                <h3>Lovely Dog</h3>
            </div>

            <div class="gallery-item" data-category="flowers">
                <img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=800" alt="Beautiful flowers">
                <h3>Flower Garden</h3>
            </div>

            <div class="gallery-item" data-category="nature">
                <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=800" alt="Sunrise landscape">
                <h3>Golden Sunrise</h3>
            </div>

            <div class="gallery-item" data-category="animals">
                <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=800" alt="Cute puppy">
                <h3>Happy Puppy</h3>
            </div>

            <div class="gallery-item" data-category="flowers">
                <img src="https://images.unsplash.com/photo-1462275646964-a0e3386b89fa?w=800" alt="Pink flowers">
                <h3>Pink Blossoms</h3>
            </div>
        </section>

<div class="lightbox" id="lightbox">
    <button id="closeBtn" class="close-btn">&times;</button>

    <button id="prevBtn" class="nav-btn">&#10094;</button>

    <img id="lightboxImg" src="" alt="Preview">

    <button id="nextBtn" class="nav-btn">&#10095;</button>
</div>

    </main>

    <footer>
        <p>© 2026 My Image Gallery | Created by Me</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
